<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>현이네 가족 스케줄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 가족 냉장고 달력 — today strip, month calendar + selected-day panel, then the weekly pickup table on its own. */
:root{
  --paper:#F4F6F1; --card:#FFFFFF; --ink:#1D3127; --muted:#5D6E63; --line:#D8DFD5; --soft:#ECF0E8;
  --pick:#F2B705; --pick-ink:#3A2C00; --pick-soft:#FFF4CC; --sun:#C2452F; --sat:#2F68A8;
  --display:"Gaegu","IBM Plex Sans KR",cursive;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#121A15; --card:#1A251F; --ink:#E5EEE8; --muted:#9CAFA2; --line:#2B3930; --soft:#202D26;
  --pick:#F5C334; --pick-ink:#2A2000; --pick-soft:#3A3212; --sun:#EE8571; --sat:#7DB0E8; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-block:26px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:34px}
  .wrap>*{min-width:0}
h1,h2{font-family:var(--display);font-weight:700;margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(36px,6.5vw,56px)} h2{font-size:28px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pick);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)} .num{font-variant-numeric:tabular-nums}

header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px 24px;border-bottom:2px dashed var(--line);padding-bottom:20px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--mc)}
.chip[aria-pressed="false"]{opacity:.45}
.chip.pick[aria-pressed="true"]{background:var(--pick);border-color:var(--pick);color:var(--pick-ink)}

/* today */
.today{display:grid;gap:12px}
.row-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 14px}
.today-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tcard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--mc);border-radius:12px;padding:12px 14px;display:grid;gap:3px}
.tcard .t{font-size:22px;font-weight:600;line-height:1.1}
.tcard.is-pick{background:var(--pick-soft);border-color:var(--pick);border-left-color:var(--pick)}
.badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;padding:1px 7px;border-radius:999px;background:var(--pick);color:var(--pick-ink);vertical-align:2px}
.who{font-weight:600;color:var(--mc)}
.empty{color:var(--muted);padding:10px 0}

/* calendar */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.cal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-nav .m{font-family:var(--display);font-size:30px}
.nav-btns{display:flex;gap:6px}
.nbtn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:5px 12px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:12px;font-weight:600;text-align:center;color:var(--muted);padding:4px 0}
.dow.sun{color:var(--sun)} .dow.sat{color:var(--sat)}
.cell{border:0;background:var(--soft);border-radius:9px;min-height:104px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden}
.cell.out{background:transparent;opacity:.4}
.cell .d{font-size:13px;font-weight:600}
.cell.sun .d{color:var(--sun)} .cell.sat .d{color:var(--sat)}
.cell.today .d{background:var(--ink);color:var(--paper);border-radius:999px;padding:0 7px;align-self:flex-start}
.cell.sel{outline:2px solid var(--ink);outline-offset:-2px}
.ev{font-size:11.5px;line-height:1.3;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--mc);background:var(--card)}
.ev.pick{background:var(--pick);color:var(--pick-ink);border-left-color:var(--mc)}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--mc)}
.dots i.pick{outline:2px solid var(--pick);outline-offset:1px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;position:sticky;top:12px}
.panel h3{margin:0;font-family:var(--display);font-size:26px}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.plist li{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:8px 10px;border-radius:10px;background:var(--soft);border-left:4px solid var(--mc)}
.plist li.pick{background:var(--pick-soft);border-left-color:var(--pick)}
.plist .tm{font-weight:600}
.plist .sub{font-size:12.5px;color:var(--muted)}

@media (max-width:900px){.cal-wrap{grid-template-columns:1fr}.panel{position:static}}
@media (max-width:620px){
  .cell{min-height:58px;padding:5px;align-items:center}
  .ev,.more{display:none} .dots{display:flex;justify-content:center}
  .cal{padding:10px}
}

/* pickup table */
.ptable-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
thead th{font-size:13px;color:var(--muted);font-weight:600;background:var(--soft)}
tbody th{font-weight:600;white-space:nowrap}
td .pp{display:block;padding:6px 8px;border-radius:8px;background:var(--pick-soft);border-left:4px solid var(--mc);margin-bottom:6px}
td .pp b{font-variant-numeric:tabular-nums}
td .pp span{display:block;font-size:12.5px;color:var(--muted)}
td.is-today{background:color-mix(in srgb,var(--pick) 12%,transparent)}

.notes ul{list-style:none;padding:0;margin:10px 0 0}
.notes li{padding:9px 0;border-bottom:1px solid var(--line)}
footer{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">FAMILY CALENDAR</div>
      <h1 id="title">현이네 가족 스케줄</h1>
      <div class="muted num" id="todayLabel"></div>
    </div>
    <div class="filters" id="filters" aria-label="보기 필터"></div>
  </header>

  <section class="today" aria-labelledby="todayTitle">
    <div class="row-head"><h2 id="todayTitle">오늘 일정</h2><span class="muted" id="todaySub"></span></div>
    <div class="today-list" id="todayList"><div class="empty">불러오는 중…</div></div>
  </section>

  <section aria-labelledby="calTitle">
    <div class="row-head" style="margin-bottom:12px"><h2 id="calTitle">전체 일정 달력</h2>
      <span class="muted" style="font-size:13px"><span class="badge">픽업</span> 노란색이 픽업 일정이에요</span></div>
    <div class="cal-wrap">
      <div class="cal">
        <div class="cal-nav">
          <div class="m num" id="monthLabel"></div>
          <div class="nav-btns">
            <button class="nbtn" id="prev" aria-label="이전 달">‹</button>
            <button class="nbtn" id="thisMonth">오늘</button>
            <button class="nbtn" id="next" aria-label="다음 달">›</button>
          </div>
        </div>
        <div class="grid" id="dows"></div>
        <div class="grid" id="grid" style="margin-top:4px"></div>
      </div>
      <aside class="panel" aria-live="polite">
        <h3 id="selTitle"></h3>
        <ul class="plist" id="selList"></ul>
      </aside>
    </div>
  </section>

  <section aria-labelledby="pickTitle">
    <div class="row-head" style="margin-bottom:12px"><h2 id="pickTitle">주간 픽업 스케줄</h2><span class="muted" style="font-size:13px">매주 반복</span></div>
    <div class="ptable-wrap"><table id="ptable"></table></div>
  </section>

  <section class="notes"><h2>가족 메모</h2><ul id="notes"></ul></section>

  <footer>일정은 GitHub 저장소의 schedule.json을 고치면 1~2분 안에 반영됩니다.</footer>
</div>

<script>
const DOW=["일","월","화","수","목","금","토"];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=new Date(); today.setHours(0,0,0,0);
const todayISO=iso(today);
$("todayLabel").textContent=`${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일 ${DOW[today.getDay()]}요일`;

let data, view=new Date(today.getFullYear(),today.getMonth(),1), selected=todayISO;
let hidden=new Set(), pickOnly=false;

function mem(name){return data.members.find(m=>m.name===name)||{name,short:name,color:"#888"}}

// All items on a given date (weekly repeats + dated events), filtered
function itemsOn(d){
  const key=iso(d), dw=DOW[d.getDay()], skip=new Set(data.skip||[]);
  const w=skip.has(key)?[]:(data.weekly||[]).filter(x=>x.day===dw&&(!x.from||key>=x.from)&&(!x.to||key<=x.to));
  const e=(data.events||[]).filter(x=>x.date===key);
  return [...w,...e]
    .filter(x=>!hidden.has(x.who)&&(!pickOnly||x.pickup))
    .sort((a,b)=>(a.time||"00:00").localeCompare(b.time||"00:00"));
}

function renderFilters(){
  $("filters").innerHTML=data.members.map(m=>
    `<button class="chip" style="--mc:${esc(m.color)}" data-who="${esc(m.name)}" aria-pressed="${!hidden.has(m.name)}"><i class="dot"></i>${esc(m.short)}${m.grade?` <span class="muted" style="font-weight:400">${esc(m.grade)}</span>`:""}</button>`).join("")
    +`<button class="chip pick" id="pickOnly" aria-pressed="${pickOnly}">픽업만 보기</button>`;
}

function itemLine(x){return `${esc(mem(x.who).short)} ${esc(x.title.replace("(예시) ",""))}`}

function renderToday(){
  const list=itemsOn(today);
  $("todayTitle").textContent="오늘 일정";
  const p=list.filter(x=>x.pickup).length;
  $("todaySub").textContent=list.length?`${list.length}건 · 픽업 ${p}건`:"";
  $("todayList").innerHTML=list.length?list.map(x=>{const m=mem(x.who);return `
    <article class="tcard${x.pickup?" is-pick":""}" style="--mc:${esc(m.color)}">
      <div class="t num">${esc(x.time||"종일")} ${x.pickup?'<span class="badge">픽업</span>':""}</div>
      <div><span class="who">${esc(m.short)}</span> · ${esc(x.title)}</div>
      ${x.place?`<div class="muted" style="font-size:13px">${esc(x.place)}</div>`:""}
    </article>`}).join(""):`<div class="empty">오늘은 등록된 일정이 없어요.</div>`;
}

function renderCalendar(){
  $("monthLabel").textContent=`${view.getFullYear()}년 ${view.getMonth()+1}월`;
  $("dows").innerHTML=DOW.map((d,i)=>`<div class="dow${i===0?" sun":i===6?" sat":""}">${d}</div>`).join("");
  const start=new Date(view); start.setDate(1-view.getDay());
  const cells=[];
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    if(i===35&&d.getMonth()!==view.getMonth()) break;
    const key=iso(d), items=itemsOn(d), out=d.getMonth()!==view.getMonth();
    const cls=["cell",out&&"out",d.getDay()===0&&"sun",d.getDay()===6&&"sat",key===todayISO&&"today",key===selected&&"sel"].filter(Boolean).join(" ");
    const shown=items.slice(0,3);
    cells.push(`<button class="${cls}" data-date="${key}" aria-label="${d.getMonth()+1}월 ${d.getDate()}일, 일정 ${items.length}건">
      <span class="d num">${d.getDate()}</span>
      ${shown.map(x=>`<span class="ev${x.pickup?" pick":""}" style="--mc:${esc(mem(x.who).color)}">${itemLine(x)}</span>`).join("")}
      ${items.length>3?`<span class="more">+${items.length-3}건</span>`:""}
      <span class="dots">${items.map(x=>`<i class="${x.pickup?"pick":""}" style="--mc:${esc(mem(x.who).color)}"></i>`).join("")}</span>
    </button>`);
  }
  $("grid").innerHTML=cells.join("");
  renderSelected();
}

function renderSelected(){
  const [y,m,dd]=selected.split("-").map(Number), d=new Date(y,m-1,dd);
  $("selTitle").textContent=`${m}월 ${dd}일 ${DOW[d.getDay()]}요일${selected===todayISO?" · 오늘":""}`;
  const items=itemsOn(d);
  $("selList").innerHTML=items.length?items.map(x=>{const mm=mem(x.who);return `
    <li class="${x.pickup?"pick":""}" style="--mc:${esc(mm.color)}">
      <span class="tm num">${esc(x.time||"종일")}</span>
      <span><span class="who">${esc(mm.short)}</span> ${esc(x.title)} ${x.pickup?'<span class="badge">픽업</span>':""}
      ${x.place?`<span class="sub" style="display:block">${esc(x.place)}</span>`:""}</span>
    </li>`}).join(""):`<li style="grid-template-columns:1fr;background:transparent;border:0" class="muted">일정이 없어요.</li>`;
}

function renderPickups(){
  const days=["월","화","수","목","금","토"];
  const used=days.filter(d=>(data.weekly||[]).some(x=>x.pickup&&x.day===d)||["월","화","수","목","금"].includes(d));
  const kids=data.members.filter(m=>(data.weekly||[]).some(x=>x.pickup&&x.who===m.name));
  const tdw=DOW[today.getDay()];
  $("ptable").innerHTML=`<thead><tr><th></th>${used.map(d=>`<th>${d}</th>`).join("")}</tr></thead><tbody>`+
    kids.map(k=>`<tr><th style="color:${esc(k.color)}">${esc(k.short)}<div class="muted" style="font-size:12px;font-weight:400">${esc(k.grade)}</div></th>${used.map(d=>{
      const ps=data.weekly.filter(x=>x.pickup&&x.day===d&&x.who===k.name).sort((a,b)=>a.time.localeCompare(b.time));
      return `<td class="${d===tdw?"is-today":""}">${ps.map(x=>`<div class="pp" style="--mc:${esc(k.color)}"><b>${esc(x.time)}</b><span>${esc(x.place||x.title)}</span></div>`).join("")||'<span class="muted">–</span>'}</td>`}).join("")}</tr>`).join("")+`</tbody>`;
}

function renderAll(){renderFilters();renderToday();renderCalendar();renderPickups();
  $("notes").innerHTML=(data.notes||[]).map(n=>`<li>${esc(n)}</li>`).join("")||'<li class="muted">메모 없음</li>';}

document.addEventListener("click",e=>{
  const c=e.target.closest("[data-date]"); if(c){selected=c.dataset.date;
    const [y,m]=selected.split("-").map(Number); if(m-1!==view.getMonth()) view=new Date(y,m-1,1);
    renderCalendar(); return;}
  const w=e.target.closest("[data-who]"); if(w){const n=w.dataset.who; hidden.has(n)?hidden.delete(n):hidden.add(n); renderFilters();renderToday();renderCalendar(); return;}
  if(e.target.closest("#pickOnly")){pickOnly=!pickOnly;renderFilters();renderToday();renderCalendar();}
});
$("prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);renderCalendar()};
$("next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);renderCalendar()};
$("thisMonth").onclick=()=>{view=new Date(today.getFullYear(),today.getMonth(),1);selected=todayISO;renderCalendar()};

fetch("schedule.json",{cache:"no-store"}).then(r=>r.json()).then(j=>{data=j;
  if(j.familyName){$("title").textContent=j.familyName+" 가족 스케줄";document.title=j.familyName+" 가족 스케줄";}
  renderAll();})
  .catch(()=>{$("todayList").innerHTML='<div class="empty">schedule.json을 읽지 못했어요. 쉼표나 따옴표가 빠지지 않았는지 확인해주세요.</div>'});
</script>
</body>
</html>
