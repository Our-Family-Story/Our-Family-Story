<style>
/* Layout: 냉장고 달력 — Korean month calendar (일요일·공휴일 red) with an editable day panel; below, live pickup strip and Mon–Sat time-axis timetable. */
:root{
  --paper:#F4F6F1; --card:#FFFFFF; --ink:#1D3127; --muted:#5D6E63; --line:#D8DFD5; --soft:#ECF0E8;
  --pick:#F2B705; --pick-ink:#3A2C00; --pick-soft:#FFF4CC; --sun:#D23F2A; --sat:#2F68A8; --hol-soft:#FCE9E5;
  --live:#D6402B; --ok:#2E8B57;
  --display:"Gaegu","IBM Plex Sans KR",cursive;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --hour:58px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#121A15; --card:#1A251F; --ink:#E5EEE8; --muted:#9CAFA2; --line:#2B3930; --soft:#202D26;
  --pick:#F5C334; --pick-ink:#2A2000; --pick-soft:#3A3212; --sun:#F08A76; --sat:#7DB0E8; --hol-soft:#3A2420;
  --live:#F07462; --ok:#5CC08A; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-block:26px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:38px}
.wrap>*{min-width:0}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(36px,6.5vw,56px)} h2{font-size:30px} h3{font-size:24px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pick);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)} .num{font-variant-numeric:tabular-nums}
.row-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 14px;margin-bottom:12px}

header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px 24px;border-bottom:2px dashed var(--line);padding-bottom:20px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.legend small{font-weight:400;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mc);display:inline-block}

/* calendar */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.cal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-nav .m{font-family:var(--display);font-size:30px}
.nav-btns{display:flex;gap:6px}
.nbtn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:5px 12px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:12px;font-weight:600;text-align:center;color:var(--muted);padding:4px 0}
.dow.sun{color:var(--sun)} .dow.sat{color:var(--sat)}
.cell{border:0;background:var(--soft);border-radius:9px;min-height:96px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden}
.cell.out{background:transparent;opacity:.4}
.cell .top{display:flex;align-items:baseline;gap:5px;min-width:0}
.cell .d{font-size:13px;font-weight:600;flex:none}
.cell .hn{font-size:10.5px;color:var(--sun);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cell.sun .d,.cell.hol .d{color:var(--sun)} .cell.sat:not(.hol) .d{color:var(--sat)}
.cell.hol{background:var(--hol-soft)}
.cell.today .d{background:var(--ink);color:var(--paper);border-radius:999px;padding:0 7px}
.cell.sel{outline:2px solid var(--ink);outline-offset:-2px}
.ev{font-size:12px;line-height:1.3;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--mc);color:#fff;font-weight:500}
.dots{display:none;gap:3px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mc)}

.panel{display:grid;gap:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px}
.box-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hol-tag{font-size:12px;font-weight:600;color:var(--sun);background:var(--hol-soft);padding:2px 8px;border-radius:999px;justify-self:start}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.plist li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--soft);border-left:4px solid var(--mc)}
.plist .tm{font-weight:600;font-size:13px}
.dday{font-weight:600;font-size:13px;color:var(--mc);min-width:42px}
.who{font-weight:600;color:var(--mc)}
.ebtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:3px 10px;font-size:12.5px}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--sun);border:1px solid var(--sun)}
.btn.add{background:var(--soft);color:var(--ink);border:1.5px dashed var(--line);width:100%}
.btn[disabled]{opacity:.5;cursor:wait}

/* edit form */
.form{display:grid;gap:10px;padding:12px;border-radius:12px;background:var(--soft)}
.field{display:grid;gap:4px}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.field input,.field select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;align-items:center;gap:6px;font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.actions .sp{flex:1}
.msg{font-size:13px;min-height:1em}
.msg.err{color:var(--sun)} .msg.ok{color:var(--ok)}

/* github connect */
.connect{display:grid;gap:10px;font-size:13.5px}
.connect ol{margin:0;padding-left:20px;display:grid;gap:4px}
.connect code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:12.5px;overflow-wrap:anywhere}
.conn-status{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.linkbtn{border:0;background:none;padding:0;text-decoration:underline;color:var(--muted);font-size:12.5px}

@media (max-width:900px){.cal-wrap{grid-template-columns:1fr}}
@media (max-width:620px){
  .cell{min-height:58px;align-items:center}
  .cell .top{flex-direction:column;align-items:center;gap:0}
  .cell .hn{font-size:9px;max-width:100%}
  .ev{display:none}.dots{display:flex}
  .cal{padding:10px}
}

/* live pickup */
.pick-sec{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:18px}
.pick-sec>*,.live>*{min-width:0}
.live{display:grid;gap:12px}
.live-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.clock{font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--live);display:inline-block}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 1.6s infinite}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.next b{font-variant-numeric:tabular-nums}
.live-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.lcard{border:1px solid var(--line);border-left:5px solid var(--mc);border-radius:12px;padding:12px 14px;display:grid;gap:4px;background:var(--paper)}
.lcard .t{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.st{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.st.wait{background:var(--soft);color:var(--muted)}
.st.soon{background:var(--pick);color:var(--pick-ink)}
.st.now{background:var(--live);color:#fff}
.st.done{background:transparent;color:var(--ok);border:1.5px solid var(--ok)}
.lcard.is-soon{background:var(--pick-soft);border-color:var(--pick);border-left-color:var(--mc)}
.lcard.is-now{border-color:var(--live);border-left-color:var(--live)}
.lcard.is-done{opacity:.6}
.lcard.is-done .t span.ltime{text-decoration:line-through}
.chk{justify-self:start;margin-top:4px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600}
.lcard.is-done .chk{border-color:var(--ok);color:var(--ok)}
.empty{color:var(--muted);padding:6px 0}

/* time-axis timetable */
.tt-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.tt{min-width:600px;display:grid;grid-template-columns:56px repeat(6,minmax(0,1fr))}
.tt-h{background:var(--soft);padding:8px 6px;text-align:center;font-weight:600;font-size:14px;border-bottom:1px solid var(--line)}
.tt-h.today{background:var(--ink);color:var(--paper)}
.tt-h.sat{color:var(--sat)} .tt-h.hol{color:var(--sun)} .tt-h.today.sat,.tt-h.today.hol{color:var(--paper)}
.tt-h small{display:block;font-weight:400;font-size:11.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.axis{position:relative;border-right:1px solid var(--line)}
.axis span{position:absolute;right:8px;transform:translateY(-50%);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.col{position:relative;border-left:1px solid var(--line);
  background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hour));background-position:0 12px}
.col.today{background-color:color-mix(in srgb,var(--pick) 9%,transparent)}
.col.hol{background-color:var(--hol-soft)}
.blk{position:absolute;left:4px;right:4px;border-radius:7px;padding:3px 7px;background:var(--mc);color:#fff;font-size:12px;line-height:1.25;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.blk b{font-variant-numeric:tabular-nums;font-size:12.5px}
.blk span{opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.done,.blk.off{opacity:.35}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--live);z-index:3}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--live)}
@media (max-width:620px){
  .tt{min-width:0;grid-template-columns:42px repeat(6,minmax(0,1fr))}
  .axis span{right:4px;font-size:10.5px}
  .tt-h{font-size:13px;padding:6px 2px}
  .blk{left:2px;right:2px;padding:2px 4px;font-size:11px}
  .blk b{font-size:11px;white-space:normal}
  .blk span{display:none}
}

.notes ul{list-style:none;padding:0;margin:10px 0 0}
.notes li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:start}
.notes li .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.notes .x{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px}
.note-form{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.note-form input{flex:1 1 220px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
button.blk{border:0;text-align:left;font-family:inherit;color:#fff;cursor:pointer;line-height:1.2;align-items:stretch}
.col.can{cursor:copy}
dialog{border:0;border-radius:16px;padding:6px;background:var(--card);color:var(--ink);width:min(420px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,20,14,.45)}
footer{font-size:13px;color:var(--muted);display:grid;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:calc(100vw - 32px)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">FAMILY CALENDAR</div>
      <h1 id="title">현이네 가족 스케줄</h1>
      <div class="muted num" id="todayLabel"></div>
    </div>
    <div class="legend" id="legend"></div>
  </header>

  <section aria-labelledby="calTitle">
    <div class="row-head"><h2 id="calTitle">월간 스케줄</h2><span class="muted" style="font-size:13px">날짜를 누르면 일정을 추가·수정할 수 있어요</span></div>
    <div class="cal-wrap">
      <div class="cal">
        <div class="cal-nav">
          <div class="m num" id="monthLabel"></div>
          <div class="nav-btns">
            <button class="nbtn" id="prev" aria-label="이전 달">‹</button>
            <button class="nbtn" id="thisMonth">오늘</button>
            <button class="nbtn" id="next" aria-label="다음 달">›</button>
          </div>
        </div>
        <div class="grid" id="dows"></div>
        <div class="grid" id="grid" style="margin-top:4px"></div>
      </div>
      <div class="panel">
        <div class="box" id="dayBox" aria-live="polite"></div>
        <div class="box"><h3>다가오는 일정</h3><ul class="plist" id="upcoming"></ul></div>
      </div>
    </div>
  </section>

  <section aria-labelledby="pickTitle">
    <div class="row-head"><h2 id="pickTitle">픽업</h2><span class="muted" style="font-size:13px">매주 반복 · 월~토 · 공휴일은 쉼</span></div>
    <div class="pick-sec">
      <div class="live">
        <div class="live-head">
          <span class="pulse" aria-hidden="true"></span>
          <h3>실시간 픽업 현황</h3>
          <span class="clock" id="clock"></span>
        </div>
        <div id="nextLine"></div>
        <div class="live-list" id="liveList"></div>
      </div>
      <div>
        <div class="box-head" style="margin-bottom:10px"><h3>주간 픽업 스케줄</h3><button class="ebtn" id="pkAdd" hidden>+ 픽업 추가</button></div>
        <div class="muted" id="pkHint" style="font-size:12.5px;margin:-4px 0 10px" hidden>블록을 누르면 수정, 빈 칸을 누르면 그 시간에 픽업을 추가해요.</div>
        <div class="tt-scroll"><div class="tt" id="tt"></div></div>
      </div>
    </div>
  </section>

  <section class="notes"><h2>가족 메모</h2>
    <ul id="notes"></ul>
    <form class="note-form" id="noteForm" hidden>
      <input id="noteInput" maxlength="200" placeholder="예: 수요일 체육복 챙기기" aria-label="새 메모">
      <input id="nCode" type="password" autocomplete="off" placeholder="가족 비밀번호" aria-label="가족 비밀번호" style="flex:0 1 150px" hidden>
      <button class="btn" type="submit" id="noteAdd">메모 추가</button>
    </form>
  </section>

  <footer>
    <div>일정·픽업·메모·"픽업 완료"는 이 화면에서 바로 고치고, 가족 모두에게 공유돼요.</div>
    <div class="conn-status" id="connStatus"></div>
  </footer>
</div>
<div class="toast" id="toast" hidden></div>
<dialog id="pkDlg" aria-labelledby="pkTitle">
  <form class="form" id="pkForm" method="dialog" style="background:transparent">
    <strong id="pkTitle" style="font-size:17px">픽업 추가</strong>
    <div class="row2">
      <div class="field"><label for="pDay">요일</label><select id="pDay"><option>월</option><option>화</option><option>수</option><option>목</option><option>금</option><option>토</option></select></div>
      <div class="field"><label for="pTime">시간</label><input id="pTime" type="time" required></div>
    </div>
    <div class="row2">
      <div class="field"><label for="pWho">누구</label><select id="pWho"></select></div>
      <div class="field"><label for="pPlace">장소</label><input id="pPlace" maxlength="40" placeholder="예: 학원"></div>
    </div>
    <div class="field" id="pCodeWrap" hidden><label for="pCode">가족 비밀번호 (처음 한 번만)</label><input id="pCode" type="password" autocomplete="off"></div>
    <div class="msg" id="pMsg"></div>
    <div class="actions">
      <button type="button" class="btn danger" id="pDel" hidden>삭제</button>
      <span class="sp"></span>
      <button type="button" class="btn ghost" id="pCancel">취소</button>
      <button type="submit" class="btn" id="pSave">저장</button>
    </div>
  </form>
</dialog>

<script>
const DOW=["일","월","화","수","목","금","토"], PDAYS=["월","화","수","목","금","토"];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mins=t=>{const [h,m]=String(t).split(":").map(Number);return h*60+(m||0)};
const mem=n=>MEMBERS.find(m=>m.name===n)||{name:n,color:"#888",grade:""};
const byTime=(a,b)=>mins(a.time||"0:00")-mins(b.time||"0:00");
const parseISO=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,4000)}

const today=new Date(); today.setHours(0,0,0,0);
const todayISO=iso(today);
let view=new Date(today.getFullYear(),today.getMonth(),1), selected=todayISO;
let events=EVENTS.slice(), pickups=PICKUPS.slice(), notes=NOTES.slice(), serverOK=false, needCode=false, loaded=false;

$("title").textContent=FAMILY+" 가족 스케줄"; document.title=FAMILY+" 가족 스케줄";
$("todayLabel").textContent=`${today.getFullYear()}년 ${today.getMonth()+1}월 ${today.getDate()}일 ${DOW[today.getDay()]}요일${HOLIDAYS[todayISO]?" · "+HOLIDAYS[todayISO]:""}`;
$("legend").innerHTML=MEMBERS.map(m=>`<span style="--mc:${esc(m.color)}"><i class="dot"></i>${esc(m.name)}${m.grade?` <small>${esc(m.grade)}</small>`:""}</span>`).join("");

/* ================= 월간 스케줄 ================= */
const eventsOn=key=>events.filter(e=>e.date===key).sort(byTime);

function renderCalendar(){
  $("monthLabel").textContent=`${view.getFullYear()}년 ${view.getMonth()+1}월`;
  $("dows").innerHTML=DOW.map((d,i)=>`<div class="dow${i===0?" sun":i===6?" sat":""}">${d}</div>`).join("");
  const start=new Date(view); start.setDate(1-view.getDay());
  let html="";
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    if(i===35&&d.getMonth()!==view.getMonth()) break;
    const key=iso(d), ev=eventsOn(key), hol=HOLIDAYS[key];
    const cls=["cell",d.getMonth()!==view.getMonth()&&"out",d.getDay()===0&&"sun",d.getDay()===6&&"sat",hol&&"hol",key===todayISO&&"today",key===selected&&"sel"].filter(Boolean).join(" ");
    html+=`<button class="${cls}" data-date="${key}" aria-label="${d.getMonth()+1}월 ${d.getDate()}일${hol?" "+hol:""}${ev.length?`, 일정 ${ev.length}건`:""}">
      <span class="top"><span class="d num">${d.getDate()}</span>${hol?`<span class="hn">${esc(hol)}</span>`:""}</span>
      ${ev.map(e=>`<span class="ev" style="--mc:${esc(mem(e.who).color)}">${esc(e.title.replace("(예시) ",""))}</span>`).join("")}
      <span class="dots">${ev.map(e=>`<i style="--mc:${esc(mem(e.who).color)}"></i>`).join("")}</span>
    </button>`;
  }
  $("grid").innerHTML=html;
  renderDay();
  renderUpcoming();
}

let editing=null; // null | {mode:"add"} | {mode:"edit", orig}
function renderDay(){
  const sd=parseISO(selected), ev=eventsOn(selected), hol=HOLIDAYS[selected];
  let h=`<div class="box-head"><h3>${sd.getMonth()+1}월 ${sd.getDate()}일 ${DOW[sd.getDay()]}요일${selected===todayISO?" · 오늘":""}</h3></div>`;
  if(hol) h+=`<span class="hol-tag">공휴일 · ${esc(hol)}</span>`;
  h+=`<ul class="plist">${ev.length?ev.map((e,i)=>`<li style="--mc:${esc(mem(e.who).color)}">
      <span class="tm num">${esc(e.time||"종일")}</span>
      <span><span class="who">${esc(e.who)}</span> ${esc(e.title)}</span>
      ${serverOK?`<button class="ebtn" data-edit="${i}">수정</button>`:"<span></span>"}</li>`).join("")
    :`<li style="grid-template-columns:1fr;background:transparent;border:0;padding:0" class="muted">등록된 일정이 없어요.</li>`}</ul>`;
  if(editing) h+=formHTML();
  else if(serverOK) h+=`<button class="btn add" id="addBtn">+ 이 날 일정 추가</button>`;
  else if(loaded) h+=`<span class="muted" style="font-size:13px">저장 서버에 연결되지 않아 지금은 보기만 할 수 있어요.</span>`;
  $("dayBox").innerHTML=h;
  if(editing) bindForm();
}

function formHTML(){
  const o=editing.mode==="edit"?editing.orig:{who:MEMBERS[0].name,time:"",title:""};
  return `<form class="form" id="evForm">
    <strong>${editing.mode==="edit"?"일정 수정":"새 일정"}</strong>
    <div class="field"><label for="fTitle">내용</label><input id="fTitle" required maxlength="60" value="${esc(o.title)}" placeholder="예: 학교 축제"></div>
    <div class="row2">
      <div class="field"><label for="fWho">누구</label><select id="fWho">${MEMBERS.map(m=>`<option${m.name===o.who?" selected":""}>${esc(m.name)}</option>`).join("")}</select></div>
      <div class="field"><label for="fDate">날짜</label><input id="fDate" type="date" required value="${esc(editing.mode==="edit"?o.date:selected)}"></div>
    </div>
    <div class="row2">
      <div class="field"><label for="fTime">시간</label><input id="fTime" type="time" value="${esc(o.time||"")}" ${o.time?"":"disabled"}></div>
      <label class="check" style="align-self:end;padding-bottom:8px"><input type="checkbox" id="fAllDay" ${o.time?"":"checked"}> 종일</label>
    </div>
    ${needCode&&!store.get("familyCode")?`<div class="field"><label for="fCode">가족 비밀번호 (처음 한 번만)</label><input id="fCode" type="password" autocomplete="off"></div>`:""}
    <div class="msg" id="fMsg"></div>
    <div class="actions">
      ${editing.mode==="edit"?`<button type="button" class="btn danger" id="fDel">삭제</button>`:""}
      <span class="sp"></span>
      <button type="button" class="btn ghost" id="fCancel">취소</button>
      <button type="submit" class="btn" id="fSave">저장</button>
    </div>
  </form>`;
}

function bindForm(){
  $("fAllDay").onchange=e=>{$("fTime").disabled=e.target.checked;if(!e.target.checked&&!$("fTime").value)$("fTime").value="09:00"};
  $("fCancel").onclick=()=>{editing=null;renderDay()};
  if($("fDel")) $("fDel").onclick=async()=>{
    const b=$("fDel"); if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="한 번 더 누르면 삭제";return}
    await commit({type:"delete",orig:editing.orig});
  };
  $("evForm").onsubmit=async e=>{
    e.preventDefault();
    if($("fCode")){const c=$("fCode").value.trim();if(!c){msg("가족 비밀번호를 적어주세요.","err");return}store.set("familyCode",c)}
    const next={date:$("fDate").value,who:$("fWho").value,title:$("fTitle").value.trim()};
    if(!$("fAllDay").checked&&$("fTime").value) next.time=$("fTime").value;
    if(!next.title||!next.date){msg("내용과 날짜를 적어주세요.","err");return}
    await commit(editing.mode==="edit"?{type:"update",orig:editing.orig,next}:{type:"add",next});
  };
  $("fTitle").focus();
}
function msg(t,k){const m=$("fMsg");if(m){m.textContent=t;m.className="msg "+(k||"")}}

function renderUpcoming(){
  const up=events.filter(e=>e.date>=todayISO).sort((a,b)=>a.date.localeCompare(b.date)||byTime(a,b)).slice(0,5);
  $("upcoming").innerHTML=up.length?up.map(e=>{const d=parseISO(e.date),n=Math.round((d-today)/864e5);
    return `<li style="--mc:${esc(mem(e.who).color)};grid-template-columns:auto 1fr"><span class="dday num">${n===0?"D-DAY":"D-"+n}</span><span><span class="who">${esc(e.who)}</span> ${esc(e.title)}<br><span class="muted num" style="font-size:12.5px">${d.getMonth()+1}/${d.getDate()} (${DOW[d.getDay()]})${e.time?" "+esc(e.time):""}</span></span></li>`}).join("")
    :`<li style="grid-template-columns:1fr;background:transparent;border:0;padding:0" class="muted">예정된 일정이 없어요.</li>`;
}

/* ================= 저장 (Cloudflare) ================= */
const API="/api/state";
const SEED={events:EVENTS,pickups:PICKUPS,notes:NOTES};
let doneMap={};
function applyState(d){
  if(Array.isArray(d.events)) events=d.events;
  if(Array.isArray(d.pickups)) pickups=d.pickups;
  if(Array.isArray(d.notes)) notes=d.notes;
  doneMap=(d.done&&d.done[todayISO])||{};
}
async function sync(first){
  try{
    const r=await fetch(API,{cache:"no-store"}); if(!r.ok) throw 0;
    const d=await r.json(); serverOK=true; needCode=!!d.needCode; applyState(d);
  }catch(e){ if(first){serverOK=false; doneMap=store.get("pickupDone")||{};} }
  loaded=true;
  if(!editing) renderCalendar(); else renderUpcoming();
  if(!$("pkDlg").open) renderLive(); renderNotes(); renderStatus();
}
function renderStatus(){
  $("connStatus").innerHTML=serverOK?"✓ 저장 서버 연결됨 · 가족 모두에게 바로 반영돼요"
    :"저장 서버에 연결되지 않았어요. Cloudflare 주소(…pages.dev)로 열었는지 확인해주세요.";
}
async function post(body){
  const h={"content-type":"application/json"}; const c=store.get("familyCode"); if(c) h["x-family-code"]=c;
  const r=await fetch(API,{method:"POST",headers:h,body:JSON.stringify(body)});
  let d={}; try{d=await r.json()}catch(e){}
  if(!r.ok){const e=new Error(d.error||"http");e.status=r.status;e.data=d;throw e}
  return d;
}

async function commit(change){
  const save=$("fSave"); if(save){save.disabled=true;save.textContent="저장 중…"}
  msg("저장하는 중…");
  try{
    const d=await post({op:change.type,orig:change.orig,next:change.next,seed:SEED});
    applyState(d); editing=null; renderNotes();
    if(change.next&&change.next.date!==selected){selected=change.next.date;const dt=parseISO(selected);view=new Date(dt.getFullYear(),dt.getMonth(),1)}
    renderCalendar();
    toast(change.type==="add"?"추가했어요.":change.type==="delete"?"삭제했어요.":"수정했어요.");
  }catch(e){
    if(save){save.disabled=false;save.textContent="저장"}
    if(e.status===401){store.del("familyCode");msg("가족 비밀번호가 맞지 않아요. 다시 적어주세요.","err");renderDay();msg("가족 비밀번호가 맞지 않아요. 다시 적어주세요.","err");}
    else if(e.status===409){applyState(e.data);editing=null;renderCalendar();toast("다른 가족이 먼저 이 일정을 바꿨어요. 최신 내용으로 다시 확인해주세요.");}
    else msg("저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러주세요.","err");
  }
}
async function toggleDone(k){
  const v=!doneMap[k]; doneMap={...doneMap}; if(v) doneMap[k]=true; else delete doneMap[k];
  renderLive();
  if(!serverOK){store.set("pickupDone",doneMap);return}
  try{applyState(await post({op:"done",date:todayISO,key:k,value:v,seed:SEED}));renderLive()}
  catch(e){ if(e.status===401){store.del("familyCode");toast("가족 비밀번호가 필요해요. 일정이나 픽업을 한 번 저장하면서 입력해주세요.")} else toast("픽업 완료를 저장하지 못했어요."); sync(); }
}

/* ================= 실시간 픽업 ================= */
const noPick=new Set(NO_PICKUP_DAYS);
const offDay=d=>{const k=iso(d);return noPick.has(k)||(SKIP_PICKUP_ON_HOLIDAYS&&!!HOLIDAYS[k])};
const pickupsFor=d=>offDay(d)?[]:pickups.filter(p=>p.day===DOW[d.getDay()]).sort(byTime);
const doneKey=p=>`${todayISO}|${p.time}|${p.who}`;
function fmtDur(m){const h=Math.floor(m/60),r=m%60;return h?`${h}시간${r?" "+r+"분":""}`:`${r}분`}
function status(p,nowM){
  if(doneMap[doneKey(p)]) return ["done","완료"];
  const diff=mins(p.time)-nowM;
  if(diff>30) return ["wait",`${fmtDur(diff)} 후`];
  if(diff>0) return ["soon",`${diff}분 후 · 곧 출발`];
  if(diff>-30) return ["now","픽업 시간"];
  return ["done","시간 지남"];
}
function nextPickup(now){
  const nowM=now.getHours()*60+now.getMinutes();
  for(let i=0;i<14;i++){
    const d=new Date(today); d.setDate(today.getDate()+i);
    const list=pickupsFor(d).filter(p=>i>0||(mins(p.time)>nowM&&!doneMap[doneKey(p)]));
    if(list.length) return {p:list[0],d,i};
  }
  return null;
}
function renderLive(){
  const now=new Date(), nowM=now.getHours()*60+now.getMinutes();
  $("clock").textContent=`${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const list=pickupsFor(today), hol=HOLIDAYS[todayISO];
  $("liveList").innerHTML=list.length?list.map(p=>{
    const m=mem(p.who), [k,label]=status(p,nowM), isDone=!!doneMap[doneKey(p)];
    return `<article class="lcard is-${k}${isDone?" is-done":""}" style="--mc:${esc(m.color)}">
      <div class="t"><span class="ltime">${esc(p.time)}</span><span class="st ${k}">${esc(label)}</span></div>
      <div><span class="who">${esc(p.who)}</span> · ${esc(p.place)}</div>
      <button class="chk" data-done="${esc(doneKey(p))}">${isDone?"✓ 픽업 완료":"픽업 완료 표시"}</button>
    </article>`}).join(""):`<div class="empty">${hol&&SKIP_PICKUP_ON_HOLIDAYS?`오늘은 ${esc(hol)}이라 픽업이 없어요.`:"오늘은 픽업이 없어요."}</div>`;
  const n=nextPickup(now);
  if(!n) $("nextLine").innerHTML='<span class="muted">예정된 픽업이 없어요.</span>';
  else{
    const when=n.i===0?`오늘 <b>${esc(n.p.time)}</b> (${fmtDur(mins(n.p.time)-nowM)} 후)`
      :`${n.i===1?"내일":`${n.d.getMonth()+1}/${n.d.getDate()}`} (${DOW[n.d.getDay()]}) <b>${esc(n.p.time)}</b>`;
    $("nextLine").innerHTML=`다음 픽업 · <span class="who" style="--mc:${esc(mem(n.p.who).color)}">${esc(n.p.who)}</span> ${when} · ${esc(n.p.place)}`;
  }
  renderTimetable(now);
}
let TT=null;
function renderTimetable(now){
  const H=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hour"))||58;
  const all=pickups.map(p=>mins(p.time));
  const startH=all.length?Math.min(13,Math.floor(Math.min(...all)/60)):13, endH=all.length?Math.min(24,Math.max(22,Math.ceil((Math.max(...all)+40)/60))):22;
  TT={startH,endH,H,PADT:12};
  const PADT=12, hours=endH-startH, height=hours*H+PADT*2;
  const top=m=>PADT+(m-startH*60)/60*H;
  const tdw=DOW[today.getDay()];
  const mon=new Date(today); mon.setDate(today.getDate()+(today.getDay()===0?1:1-today.getDay()));
  const dates=PDAYS.map((d,i)=>{const dt=new Date(mon);dt.setDate(mon.getDate()+i);return dt});
  let h=`<div class="tt-h" style="border-right:1px solid var(--line)"></div>`;
  PDAYS.forEach((d,i)=>{const dt=dates[i],hol=HOLIDAYS[iso(dt)];
    h+=`<div class="tt-h${d===tdw?" today":""}${d==="토"?" sat":""}${hol?" hol":""}">${d}<small class="num">${hol?esc(hol):`${dt.getMonth()+1}/${dt.getDate()}`}</small></div>`});
  let axis=`<div class="axis" style="height:${height}px">`;
  for(let k=0;k<=hours;k++) axis+=`<span style="top:${PADT+k*H}px">${pad(startH+k)}:00</span>`;
  axis+="</div>";
  const nowM=now.getHours()*60+now.getMinutes();
  let cols="";
  PDAYS.forEach((d,i)=>{
    const isToday=d===tdw, off=offDay(dates[i]);
    const items=pickups.filter(p=>p.day===d).sort(byTime);
    cols+=`<div class="col${isToday?" today":""}${HOLIDAYS[iso(dates[i])]?" hol":""}${serverOK?" can":""}" data-col="${d}" style="height:${height}px">`+
      items.map(p=>{const m=mem(p.who),dn=isToday&&doneMap[doneKey(p)];
        return `<button class="blk${dn?" done":""}${off?" off":""}" data-pk="${pickups.indexOf(p)}" style="--mc:${esc(m.color)};top:${top(mins(p.time))+1}px;height:${Math.max(H*0.7,40)}px" title="${esc(p.time+" "+p.who+" "+p.place)}"><b>${esc(p.time)} ${esc(p.who)}</b><span>${esc(p.place)}</span></button>`}).join("")+
      (isToday&&nowM>=startH*60&&nowM<=endH*60?`<div class="nowline" style="top:${top(nowM)}px"></div>`:"")+
      `</div>`;
  });
  $("tt").innerHTML=h+axis+cols;
}

/* ================= 픽업 편집 ================= */
$("pWho").innerHTML=MEMBERS.filter(m=>m.name!=="가족").map(m=>`<option>${esc(m.name)}</option>`).join("")||MEMBERS.map(m=>`<option>${esc(m.name)}</option>`).join("");
let pkOrig=null;
function openPickup(p,day,time){
  pkOrig=p||null;
  $("pkTitle").textContent=p?"픽업 수정":"픽업 추가";
  $("pDay").value=p?p.day:(day||"월");
  $("pTime").value=p?p.time:(time||"15:00");
  $("pWho").value=p?p.who:$("pWho").options[0].value;
  $("pPlace").value=p?p.place||"":"";
  $("pDel").hidden=!p; $("pDel").dataset.c=""; $("pDel").textContent="삭제";
  $("pCodeWrap").hidden=!(needCode&&!store.get("familyCode"));
  $("pMsg").textContent=""; $("pMsg").className="msg";
  $("pSave").disabled=false; $("pSave").textContent="저장";
  $("pkDlg").showModal();
}
const pmsg=(t,k)=>{$("pMsg").textContent=t;$("pMsg").className="msg "+(k||"")};
async function savePickup(op,next){
  if(!$("pCodeWrap").hidden){const c=$("pCode").value.trim();if(!c){pmsg("가족 비밀번호를 적어주세요.","err");return}store.set("familyCode",c)}
  $("pSave").disabled=true; pmsg("저장하는 중…");
  try{
    applyState(await post({kind:"pickup",op,orig:pkOrig,next,seed:SEED}));
    $("pkDlg").close(); renderLive(); renderNotes();
    toast(op==="add"?"픽업을 추가했어요.":op==="delete"?"픽업을 삭제했어요.":"픽업을 수정했어요.");
  }catch(e){
    $("pSave").disabled=false;
    if(e.status===401){store.del("familyCode");$("pCodeWrap").hidden=false;pmsg("가족 비밀번호가 맞지 않아요. 다시 적어주세요.","err")}
    else if(e.status===409){applyState(e.data);$("pkDlg").close();renderLive();toast("다른 가족이 먼저 이 픽업을 바꿨어요. 최신 내용으로 다시 확인해주세요.")}
    else pmsg("저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러주세요.","err");
  }
}
$("pkForm").addEventListener("submit",e=>{
  e.preventDefault();
  const next={day:$("pDay").value,time:$("pTime").value,who:$("pWho").value,place:$("pPlace").value.trim()};
  if(!next.time){pmsg("시간을 적어주세요.","err");return}
  savePickup(pkOrig?"update":"add",next);
});
$("pCancel").onclick=()=>$("pkDlg").close();
$("pDel").onclick=()=>{const b=$("pDel");if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="한 번 더 누르면 삭제";return}savePickup("delete",null)};
$("pkAdd").onclick=()=>openPickup(null,PDAYS.includes(DOW[today.getDay()])?DOW[today.getDay()]:"월");
$("tt").addEventListener("click",e=>{
  if(!serverOK) return;
  const b=e.target.closest("[data-pk]");
  if(b){openPickup(pickups[+b.dataset.pk]);return}
  const col=e.target.closest("[data-col]");
  if(col&&TT){const y=e.clientY-col.getBoundingClientRect().top;
    let m=Math.round((TT.startH*60+(y-TT.PADT)/TT.H*60)/10)*10; m=Math.max(0,Math.min(23*60+50,m));
    openPickup(null,col.dataset.col,`${pad(Math.floor(m/60))}:${pad(m%60)}`)}
});

/* ================= 가족 메모 ================= */
function renderNotes(){
  $("notes").innerHTML=notes.length?notes.map((n,i)=>`<li><span class="txt">${esc(n)}</span>${serverOK?`<button class="x" data-note="${i}" aria-label="메모 삭제">×</button>`:""}</li>`).join("")
    :'<li class="muted">메모가 없어요. 준비물이나 일정 변경을 적어두세요.</li>';
  $("noteForm").hidden=!serverOK; $("nCode").hidden=!(needCode&&!store.get("familyCode")); $("pkAdd").hidden=!serverOK; $("pkHint").hidden=!serverOK;
}
async function noteOp(op,orig,next){
  try{applyState(await post({kind:"note",op,orig,next,seed:SEED}));renderNotes();return true}
  catch(e){
    if(e.status===401){store.del("familyCode");renderNotes();toast("가족 비밀번호가 맞지 않아요. 다시 적어주세요.")}
    else if(e.status===409){applyState(e.data);renderNotes();toast("다른 가족이 먼저 이 메모를 바꿨어요.")}
    else toast("메모를 저장하지 못했어요.");
    return false;
  }
}
$("noteForm").addEventListener("submit",async e=>{
  e.preventDefault(); const v=$("noteInput").value.trim(); if(!v) return;
  if(needCode&&!store.get("familyCode")){const c=$("nCode").value.trim();if(!c){$("nCode").hidden=false;$("nCode").focus();toast("가족 비밀번호를 적어주세요.");return}store.set("familyCode",c)}
  $("noteAdd").disabled=true;
  if(await noteOp("add",null,v)) $("noteInput").value="";
  $("noteAdd").disabled=false;
});
$("notes").addEventListener("click",e=>{const b=e.target.closest("[data-note]");if(!b) return;
  if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="삭제?";b.style.fontSize="13px";b.style.color="var(--sun)";return}
  noteOp("delete",notes[+b.dataset.note],null)});

/* ================= 이벤트 ================= */
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-date]");
  if(c){selected=c.dataset.date;editing=null;const d=parseISO(selected);
    if(d.getMonth()!==view.getMonth()||d.getFullYear()!==view.getFullYear()) view=new Date(d.getFullYear(),d.getMonth(),1);
    renderCalendar();
    if(window.innerWidth<900) $("dayBox").scrollIntoView({behavior:"smooth",block:"start"});
    return;}
  if(e.target.closest("#addBtn")){editing={mode:"add"};renderDay();return}
  const ed=e.target.closest("[data-edit]");
  if(ed){editing={mode:"edit",orig:eventsOn(selected)[+ed.dataset.edit]};renderDay();return}
  const b=e.target.closest("[data-done]");
  if(b){toggleDone(b.dataset.done);}
});
$("prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);renderCalendar()};
$("next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);renderCalendar()};
$("thisMonth").onclick=()=>{view=new Date(today.getFullYear(),today.getMonth(),1);selected=todayISO;editing=null;renderCalendar()};

renderCalendar(); renderLive(); renderNotes(); sync(true);
setInterval(()=>{ if(iso(new Date())!==todayISO) location.reload(); else sync(); },30000);
</script>
</body>
</html>
